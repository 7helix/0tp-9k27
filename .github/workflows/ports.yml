name: ports
# Compiles/tests every language port and proves they all produce identical codes to the Node reference.
on: [push, pull_request]
jobs:
  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: cd ports/go && go vet ./... && go test ./...
      - run: java ports/java/OtpFortress.java selftest
      - run: cd ports/python && python3 -m unittest
      - run: node scripts/cross-check.js 600
      - run: node scripts/run-tests.js
