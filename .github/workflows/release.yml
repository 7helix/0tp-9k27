name: release-check
on: { push: { tags: ["v*"] } }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/verify-repo.js
      - run: cd ports/python && python3 -m unittest -v
