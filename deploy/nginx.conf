# TLS terminator + coarse rate limit in front of the OTP API (defence in depth; the app has its own limits).
limit_req_zone $binary_remote_addr zone=otp:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name otp.example.com;
    ssl_certificate     /etc/letsencrypt/live/otp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 16k;

    # Only your backend network should reach this at all:
    # allow 10.0.0.0/8; deny all;

    location / {
        limit_req zone=otp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server { listen 80; server_name otp.example.com; return 301 https://$host$request_uri; }
